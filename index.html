    <meta charset="UTF-8" />

    <script>
      (function() {
        function shouldIgnore(err) {
          if (!err) return false;
          var str = (err.message || "") + " " + (err.stack || "") + " " + String(err);
          return str.indexOf("chrome: call method") !== -1 ||
                 str.indexOf("bekkpoinfafbjglppgdobfdeckghdhlo") !== -1 ||
                 str.indexOf("chrome-extension://") !== -1 ||
                 str.indexOf("moz-extension://") !== -1;
        }

        window.addEventListener("error", function(e) {
          if (shouldIgnore(e.error) || shouldIgnore(e.message) || (e.filename && e.filename.indexOf("chrome-extension://") !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener("unhandledrejection", function(e) {
          if (shouldIgnore(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
